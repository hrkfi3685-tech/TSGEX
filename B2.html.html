<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>用戶列表 — Prototype v6</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
  :root{
    --primary:#b91c1c;
    --primary-soft:#fef2f2;
    --accent:#f59e0b;
    --bg:#fafaf7;
    --panel:#ffffff;
    --border:#e5e7eb;
    --text:#1f2937;
    --muted:#6b7280;
    --ok:#16a34a;
    --ok-soft:#dcfce7;
    --danger:#dc2626;
    --danger-soft:#fee2e2;
    --level-low:#16a34a;
    --level-mid:#d97706;
    --level-high:#dc2626;
    --level-pending:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:13px}
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}

  /* Side nav */
  aside{background:#fff;border-right:1px solid var(--border);padding:14px 0}
  .brand{padding:0 18px 14px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .brand .title{color:var(--primary);font-weight:700;font-size:15px}
  .brand .sub{color:var(--muted);font-size:11px}
  .nav-group{margin-bottom:4px}
  .nav-group .head{display:flex;align-items:center;gap:8px;padding:8px 14px;color:#374151;cursor:default}
  .nav-group .head .mdi{font-size:18px;color:var(--muted)}
  .nav-group .child{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 42px;font-size:12.5px;color:#4b5563;cursor:pointer}
  .nav-group .child.active{background:#fff7ed;color:var(--primary);font-weight:600}

  /* Main */
  main{padding:18px 24px 60px}
  .breadcrumb{color:var(--muted);font-size:12px;margin-bottom:6px}
  .breadcrumb .sep{margin:0 6px;color:#cbd5e1}
  .page-title{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
  .page-title .mdi{color:var(--primary);font-size:24px}
  .page-title h1{font-size:20px;margin:0}

  /* Header Stats Grid */
  .stat-header-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .25s ease;user-select:none}
  .stat-card:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 6px 12px rgba(0,0,0,.08)}
  .stat-card.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:inset 0 0 0 1px var(--primary)}
  .stat-card .label{font-size:15px;color:var(--text);font-weight:800}
  .stat-card .num{font-size:22px;font-weight:800;color:var(--text)}

  /* Filters Panel */
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .panel-head h2{font-size:14px;margin:0;color:#374151}

  .filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .filters-row2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .filters .field,.filters-row2 .field{display:flex;flex-direction:column;gap:4px}
  .filters label,.filters-row2 label{font-size:12px;color:#4b5563;font-weight:500}
  .filters input,.filters select,.filters-row2 input,.filters-row2 select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;outline:none}
  .filters input:focus,.filters select:focus,.filters-row2 input:focus,.filters-row2 select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(185,28,28,.12)}

  /* Advanced filter toggle */
  .adv-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--primary);cursor:pointer;margin-bottom:10px;user-select:none}
  .adv-toggle .mdi{font-size:14px}
  .adv-section{border-top:1px dashed var(--border);padding-top:12px;margin-top:4px}
  .filters-adv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .filters-adv .field{display:flex;flex-direction:column;gap:4px}
  .filters-adv label{font-size:12px;color:#4b5563;font-weight:500}
  .filters-adv input,.filters-adv select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:#fff;outline:none}
  .filters-adv input:focus,.filters-adv select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(185,28,28,.12)}

  .filter-bottom{display:flex;justify-content:flex-end;align-items:center;margin-top:12px;gap:8px}

  /* Buttons */
  .btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:#a31616}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn.danger:hover{background:#b91c1c}
  .btn.success{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.success:hover{background:#15803d}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;padding:10px 8px;color:#4b5563;border-bottom:1px solid var(--border);font-weight:600;background:#fafafa;white-space:nowrap}
  td{padding:10px 8px;border-bottom:1px solid #f3f4f6;white-space:nowrap;vertical-align:middle}
  tr.row:hover{background:#fcfcfb}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid transparent}
  .pill.type{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .pill.level{background:#f3f4f6;color:#374151;border-color:#e5e7eb}
  .pill.status.ok{background:var(--ok-soft);color:var(--ok);border-color:#bbf7d0}
  .pill.status.freeze{background:var(--danger-soft);color:var(--danger);border-color:#fecaca}
  .pill.ga.bound{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .pill.ga.unbound{background:#f3f4f6;color:#6b7280;border-color:#e5e7eb}

  .risk{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
  .risk[data-r="low"]{background:#dcfce7;color:var(--level-low)}
  .risk[data-r="medium"]{background:#fef3c7;color:var(--level-mid)}
  .risk[data-r="high"]{background:#fee2e2;color:var(--level-high)}
  .risk[data-r="pending"]{background:#e5e7eb;color:var(--level-pending)}
  .risk .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  .icon-btn{width:28px;height:28px;border-radius:4px;border:1px solid var(--border);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#4b5563;margin-right:2px}
  .icon-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
  .icon-btn .mdi{font-size:16px}

  /* Table toolbar */
  .table-toolbar{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .table-toolbar-left{display:flex;align-items:center;gap:8px}
  .table-toolbar-right{display:flex;align-items:center;gap:8px}

  /* Pagination */
  .pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--border)}
  .page-info{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
  .page-info select{padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px}
  .page-nav{display:flex;align-items:center;gap:4px}
  .page-btn{width:28px;height:28px;border-radius:4px;border:1px solid var(--border);background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#4b5563}
  .page-btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
  .page-btn:disabled{opacity:.4;cursor:not-allowed}
  .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .page-btn .mdi{font-size:14px}

  /* Mask */
  .masked{display:inline-block;color:var(--muted);letter-spacing:.5px;font-size:12px}
  .btn-mask{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;color:#374151;transition:background .15s,border-color .15s}
  .btn-mask:hover{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .btn-mask.unmasked{background:#fffbeb;border-color:var(--accent);color:#92400e}
  .btn-mask .mdi{font-size:15px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:6px;opacity:0;transition:all .25s;z-index:90}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Export Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.show{opacity:1;pointer-events:all}
  .modal{background:#fff;border-radius:12px;width:460px;max-width:calc(100vw - 32px);box-shadow:0 20px 60px rgba(0,0,0,.18);transform:translateY(12px) scale(.97);transition:transform .2s,opacity .2s;opacity:0}
  .modal-overlay.show .modal{transform:translateY(0) scale(1);opacity:1}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
  .modal-header h3{margin:0;font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
  .modal-header h3 .mdi{color:var(--primary);font-size:20px}
  .modal-close{width:30px;height:30px;border-radius:6px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s}
  .modal-close:hover{background:#f3f4f6;color:var(--text)}
  .modal-close .mdi{font-size:20px}
  .modal-body{padding:18px 20px}
  .modal-desc{font-size:13px;color:var(--muted);margin-bottom:16px}
  .modal-risk-group{display:flex;flex-direction:column;gap:10px}
  .modal-risk-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
  .modal-risk-item:hover{border-color:#d1d5db;background:#fafafa}
  .modal-risk-item.selected-low{border-color:var(--level-low);background:#f0fdf4}
  .modal-risk-item.selected-medium{border-color:var(--level-mid);background:#fffbeb}
  .modal-risk-item.selected-high{border-color:var(--level-high);background:#fef2f2}
  .modal-risk-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex-shrink:0}
  .modal-risk-label{flex:1;display:flex;align-items:center;justify-content:space-between}
  .modal-risk-label .name{font-weight:600;font-size:13px}
  .modal-risk-label .count{font-size:12px;color:var(--muted);background:#f3f4f6;padding:2px 8px;border-radius:999px}
  .modal-divider{height:1px;background:var(--border);margin:16px 0}
  .modal-select-all{display:flex;align-items:center;gap:8px;font-size:13px;color:#374151;cursor:pointer;user-select:none;margin-bottom:14px}
  .modal-select-all input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="title">TSG EX</div><div class="sub">管理後台</div></div>
    <div class="nav-group">
      <div class="head"><span class="mdi mdi-account-group"></span>用戶管理</div>
      <div class="child active"><span class="mdi mdi-account-supervisor"></span>用戶列表</div>
    </div>
  </aside>

  <main>
    <div class="breadcrumb">首頁 <span class="sep">›</span> 用戶管理 <span class="sep">›</span> 用戶列表</div>
    <div class="page-title">
      <span class="mdi mdi-account-supervisor"></span>
      <h1>用戶列表</h1>
    </div>

    <!-- Stats Header -->
    <div class="stat-header-grid" id="headerStatGrid">
      <div class="stat-card" onclick="toggleStatFilter('low')" id="stat-low">
        <div class="label">低風險</div><div class="num" id="n-low">0</div>
      </div>
      <div class="stat-card" onclick="toggleStatFilter('medium')" id="stat-medium">
        <div class="label">中風險</div><div class="num" id="n-medium">0</div>
      </div>
      <div class="stat-card" onclick="toggleStatFilter('high')" id="stat-high">
        <div class="label">高風險</div><div class="num" id="n-high">0</div>
      </div>
      <div class="stat-card" onclick="toggleStatFilter('pending')" id="stat-pending">
        <div class="label">待審查</div><div class="num" id="n-pending">0</div>
      </div>
      <div class="stat-card" onclick="toggleStatFilter('all')" id="stat-all">
        <div class="label">總用戶</div><div class="num" id="n-all">0</div>
      </div>
    </div>

    <!-- Filters Panel -->
    <div class="panel">
      <div class="panel-head"><h2><span class="mdi mdi-filter-variant"></span> 篩選條件</h2></div>

      <!-- Row 1: ID / Email / Phone / Real Name -->
      <div class="filters">
        <div class="field"><label>用戶ID</label><input id="f-id" placeholder="請輸入 ID"></div>
        <div class="field"><label>電子信箱</label><input id="f-email" placeholder="請輸入 Email"></div>
        <div class="field"><label>手機</label><input id="f-phone" placeholder="請輸入手機號碼"></div>
        <div class="field"><label>真實姓名</label><input id="f-rname" placeholder="請輸入真實姓名"></div>
      </div>

      <!-- Row 2: User Type / Status / Risk Level -->
      <div class="filters-row2">
        <div class="field"><label>用戶類型</label>
          <select id="f-type">
            <option value="">全部</option>
            <option value="自然人">自然人</option>
            <option value="法人">法人</option>
          </select>
        </div>
        <div class="field"><label>狀態</label>
          <select id="f-status">
            <option value="">全部</option>
            <option value="正常">正常</option>
            <option value="凍結">凍結</option>
          </select>
        </div>
        <div class="field"><label>風險等級</label>
          <select id="f-risk" onchange="syncFilterToStat()">
            <option value="">全部</option>
            <option value="low">低風險</option>
            <option value="medium">中風險</option>
            <option value="high">高風險</option>
            <option value="pending">待審查</option>
          </select>
        </div>
      </div>

      <!-- Advanced Filter Toggle -->
      <div class="adv-toggle" onclick="toggleAdv()" id="advToggle">
        <span class="mdi mdi-plus-circle-outline" id="advIcon"></span>
        <span id="advLabel">進階篩選</span>
      </div>
      <div class="adv-section" id="advSection" style="display:none">
        <div class="filters-adv">
          <div class="field"><label>註冊開始日期</label><input id="f-date-start" type="date"></div>
          <div class="field"><label>註冊結束日期</label><input id="f-date-end" type="date"></div>
          <div class="field"><label>身分證字號</label><input id="f-idno" placeholder="請輸入身分證字號"></div>
          <div class="field"><label>用戶等級</label>
            <select id="f-level">
              <option value="">全部</option>
              <option>Level 1</option>
              <option>Level 2</option>
              <option>Level 3</option>
              <option>Level 4</option>
              <option>Level 5</option>
            </select>
          </div>
        </div>
      </div>

      <div class="filter-bottom">
        <button class="btn" onclick="clearFilters()">清空</button>
        <button class="btn primary" onclick="applyFilters()"><span class="mdi mdi-magnify"></span>搜尋</button>
      </div>
    </div>

    <!-- Data Table -->
    <div class="panel" style="padding:0">
      <div class="table-toolbar">
        <div class="table-toolbar-left">
          <h2 style="font-size:14px;margin:0;color:#374151"><span class="mdi mdi-table"></span> 用戶數據</h2>
        </div>
        <div class="table-toolbar-right">
          <button class="btn-mask" id="maskToggleBtn" onclick="toggleMask()">
            <span class="mdi mdi-eye-off-outline" id="maskIcon"></span>
            <span id="maskLabel">顯示個資</span>
          </button>
          <button class="btn danger" onclick="batchAction('凍結')"><span class="mdi mdi-lock"></span>全部凍結</button>
          <button class="btn success" onclick="batchAction('解凍')"><span class="mdi mdi-lock-open"></span>全部解凍</button>
          <button class="btn" onclick="exportCsv()"><span class="mdi mdi-download"></span>匯出 CSV</button>
        </div>
      </div>

      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>用戶類型</th>
              <th>用戶ID</th>
              <th>用戶名稱</th>
              <th>電子信箱</th>
              <th>手機</th>
              <th>用戶等級</th>
              <th>真實姓名</th>
              <th>風險等級</th>
              <th>最近評分</th>
              <th>註冊時間</th>
              <th>最後登入時間</th>
              <th>GA狀態</th>
              <th>帳號狀態</th>
              <th style="text-align:center">功能</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination">
        <div class="page-info">
          每頁項目：
          <select id="pageSize" onchange="changePageSize()">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
          <span id="pageInfoText"></span>
        </div>
        <div class="page-nav" id="pageNav"></div>
      </div>
    </div>
  </main>
</div>

<!-- Export Modal -->
<div class="modal-overlay" id="exportModal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h3><span class="mdi mdi-download-circle-outline"></span>匯出 CSV — 選擇風險等級</h3>
      <button class="modal-close" onclick="closeExportModal()" title="關閉"><span class="mdi mdi-close"></span></button>
    </div>
    <div class="modal-body">
      <p class="modal-desc">請選擇要匯出的風險等級，系統將依目前篩選結果產生 CSV 檔案。</p>

      <label class="modal-select-all">
        <input type="checkbox" id="chk-all" onchange="toggleAllRisk(this.checked)">
        全選 / 全不選
      </label>

      <div class="modal-risk-group">
        <label class="modal-risk-item" id="item-low" onclick="toggleRiskItem('low')">
          <input type="checkbox" id="chk-low" onclick="event.stopPropagation()" onchange="syncAllCheckbox()">
          <div class="modal-risk-label">
            <span class="name" style="color:var(--level-low)"><span class="mdi mdi-shield-check-outline"></span> 低風險</span>
            <span class="count" id="modal-n-low">0 筆</span>
          </div>
        </label>
        <label class="modal-risk-item" id="item-medium" onclick="toggleRiskItem('medium')">
          <input type="checkbox" id="chk-medium" onclick="event.stopPropagation()" onchange="syncAllCheckbox()">
          <div class="modal-risk-label">
            <span class="name" style="color:var(--level-mid)"><span class="mdi mdi-shield-alert-outline"></span> 中風險</span>
            <span class="count" id="modal-n-medium">0 筆</span>
          </div>
        </label>
        <label class="modal-risk-item" id="item-high" onclick="toggleRiskItem('high')">
          <input type="checkbox" id="chk-high" onclick="event.stopPropagation()" onchange="syncAllCheckbox()">
          <div class="modal-risk-label">
            <span class="name" style="color:var(--level-high)"><span class="mdi mdi-shield-off-outline"></span> 高風險</span>
            <span class="count" id="modal-n-high">0 筆</span>
          </div>
        </label>
      </div>

      <div class="modal-divider"></div>
      <div style="font-size:12px;color:var(--muted)">
        <span class="mdi mdi-information-outline"></span>
        待審查用戶不在風險匯出範圍內。已選取：<b id="modal-selected-count">0</b> 筆
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeExportModal()">取消</button>
      <button class="btn primary" onclick="confirmExport()"><span class="mdi mdi-download"></span>確認匯出</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const users = [

const RISK_LABEL = {low:"低風險",medium:"中風險",high:"高風險",pending:"待審查"};
let currentFilterType = 'all';
let filteredUsers = users.slice();
let currentPage = 1;
let pageSize = 10;
let advOpen = false;
let maskOn = true; // default: masked

/* ── Masking helpers ── */
function maskUname(v) {
  if(!v) return '—';
  const at = v.indexOf('@');
  if(at > 0) return maskEmail(v); // email-style username
  return v.slice(0, 2) + '●●●●●';
}
function maskEmail(v) {
  if(!v) return '—';
  const [local, domain] = v.split('@');
  if(!domain) return v.slice(0,2)+'●●●●●';
  const mLocal = local.slice(0,2) + '●'.repeat(Math.max(3, local.length - 2));
  const dParts = domain.split('.');
  const mDomain = dParts[0].slice(0,1) + '●●●' + '.' + dParts.slice(1).join('.');
  return mLocal + '@' + mDomain;
}
function maskPhone(v) {
  if(!v) return '—';
  return v.slice(0,3) + '●●●●' + v.slice(-2);
}
function maskRname(v) {
  if(!v) return '—';
  return v.slice(0,1) + '●●';
}
function disp(type, v) {
  if(!maskOn) return v || '—';
  switch(type){
    case 'uname': return `<span class="masked">${maskUname(v)}</span>`;
    case 'email': return `<span class="masked">${maskEmail(v)}</span>`;
    case 'phone': return v ? `<span class="masked">${maskPhone(v)}</span>` : '—';
    case 'rname': return v ? `<span class="masked">${maskRname(v)}</span>` : '—';
    default: return v || '—';
  }
}
function toggleMask() {
  maskOn = !maskOn;
  const btn  = document.getElementById('maskToggleBtn');
  const icon = document.getElementById('maskIcon');
  const lbl  = document.getElementById('maskLabel');
  if(maskOn){
    btn.classList.remove('unmasked');
    icon.className = 'mdi mdi-eye-off-outline';
    lbl.textContent = '顯示個資';
  } else {
    btn.classList.add('unmasked');
    icon.className = 'mdi mdi-eye-outline';
    lbl.textContent = '隱藏個資';
  }
  renderTable();
}

function updateStats() {
  document.getElementById('n-low').textContent = users.filter(u=>u.risk==='low').length;
  document.getElementById('n-medium').textContent = users.filter(u=>u.risk==='medium').length;
  document.getElementById('n-high').textContent = users.filter(u=>u.risk==='high').length;
  document.getElementById('n-pending').textContent = users.filter(u=>u.risk==='pending').length;
  document.getElementById('n-all').textContent = users.length;
}

function renderTable() {
  const tb = document.getElementById('tbody');
  const total = filteredUsers.length;
  const start = (currentPage - 1) * pageSize;
  const end = Math.min(start + pageSize, total);
  const pageUsers = filteredUsers.slice(start, end);

  tb.innerHTML = pageUsers.map(u=>`
    <tr class="row">
      <td><span class="pill type">${u.type}</span></td>
      <td><b>${u.id}</b></td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis">${disp('uname',u.uname)}</td>
      <td style="color:#6b7280;max-width:170px;overflow:hidden;text-overflow:ellipsis">${disp('email',u.email)}</td>
      <td style="color:#6b7280">${disp('phone',u.phone)}</td>
      <td><span class="pill level">${u.level}</span></td>
      <td>${disp('rname',u.rname)}</td>
      <td><span class="risk" data-r="${u.risk}"><span class="dot"></span>${RISK_LABEL[u.risk]}</span></td>
      <td style="color:#6b7280">${u.scoredAt||'未評估'}</td>
      <td style="color:#6b7280">${u.reg}</td>
      <td style="color:#6b7280">${u.lastLogin}</td>
      <td><span class="pill ga ${u.ga==='已綁定'?'bound':'unbound'}">${u.ga}</span></td>
      <td><span class="pill status ${u.status==='正常'?'ok':'freeze'}">${u.status}</span></td>
      <td style="text-align:center;white-space:nowrap">
        <button class="icon-btn" title="詳情" onclick="toast('詳情：${u.id}')"><span class="mdi mdi-information-outline"></span></button>
        <button class="icon-btn" title="代入登入" onclick="toast('代入登入：${u.id}')"><span class="mdi mdi-login-variant"></span></button>
        <button class="icon-btn" title="操作記錄" onclick="toast('操作記錄：${u.id}')"><span class="mdi mdi-history"></span></button>
        <button class="icon-btn" title="編輯" onclick="toast('編輯：${u.id}')"><span class="mdi mdi-account-edit"></span></button>
      </td>
    </tr>
  `).join('');

  renderPagination(total, start, end);
}

function renderPagination(total, start, end) {
  document.getElementById('pageInfoText').textContent =
    `共 ${total} 筆，第 ${total===0?0:start+1}～${end} 筆`;

  const totalPages = Math.ceil(total / pageSize) || 1;
  const nav = document.getElementById('pageNav');
  let html = `<button class="page-btn" onclick="goPage(1)" ${currentPage===1?'disabled':''}><span class="mdi mdi-chevron-double-left"></span></button>`;
  html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}><span class="mdi mdi-chevron-left"></span></button>`;

  const range = 2;
  for(let p=1;p<=totalPages;p++){
    if(p===1||p===totalPages||Math.abs(p-currentPage)<=range){
      html += `<button class="page-btn${p===currentPage?' active':''}" onclick="goPage(${p})">${p}</button>`;
    } else if(Math.abs(p-currentPage)===range+1){
      html += `<span style="padding:0 4px;color:var(--muted)">…</span>`;
    }
  }

  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}><span class="mdi mdi-chevron-right"></span></button>`;
  html += `<button class="page-btn" onclick="goPage(${totalPages})" ${currentPage===totalPages?'disabled':''}><span class="mdi mdi-chevron-double-right"></span></button>`;
  nav.innerHTML = html;
}

function goPage(p) {
  const totalPages = Math.ceil(filteredUsers.length / pageSize) || 1;
  currentPage = Math.max(1, Math.min(p, totalPages));
  renderTable();
}

function changePageSize() {
  pageSize = parseInt(document.getElementById('pageSize').value);
  currentPage = 1;
  renderTable();
}

function toggleStatFilter(type) {
  currentFilterType = (currentFilterType === type) ? 'all' : type;
  document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('active'));
  document.getElementById(`stat-${currentFilterType}`).classList.add('active');
  document.getElementById('f-risk').value = (currentFilterType === 'all' ? '' : currentFilterType);
  applyFilters();
  toast(currentFilterType === 'all' ? '顯示全部用戶' : `篩選：${RISK_LABEL[currentFilterType]}`);
}

function syncFilterToStat() {
  const val = document.getElementById('f-risk').value || 'all';
  currentFilterType = val;
  document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('active'));
  document.getElementById(`stat-${val}`).classList.add('active');
  applyFilters();
}

function applyFilters() {
  const fId     = document.getElementById('f-id').value.trim();
  const fEmail  = document.getElementById('f-email').value.trim().toLowerCase();
  const fPhone  = document.getElementById('f-phone').value.trim();
  const fRname  = document.getElementById('f-rname').value.trim();
  const fType   = document.getElementById('f-type').value;
  const fStatus = document.getElementById('f-status').value;
  const fRisk   = document.getElementById('f-risk').value;
  const fLevel  = document.getElementById('f-level').value;
  const fIdno   = document.getElementById('f-idno').value.trim();
  const fDateS  = document.getElementById('f-date-start').value;
  const fDateE  = document.getElementById('f-date-end').value;

  filteredUsers = users.filter(u => {
    if(fId     && !String(u.id).includes(fId))           return false;
    if(fEmail  && !u.email.toLowerCase().includes(fEmail)) return false;
    if(fPhone  && !u.phone.includes(fPhone))              return false;
    if(fRname  && !u.rname.includes(fRname))              return false;
    if(fType   && u.type !== fType)                       return false;
    if(fStatus && u.status !== fStatus)                   return false;
    if(fRisk   && u.risk !== fRisk)                       return false;
    if(fLevel  && u.level !== fLevel)                     return false;
    if(fDateS  && u.reg.slice(0,10) < fDateS)             return false;
    if(fDateE  && u.reg.slice(0,10) > fDateE)             return false;
    return true;
  });

  currentPage = 1;
  renderTable();
}

function clearFilters() {
  ['f-id','f-email','f-phone','f-rname','f-type','f-status','f-risk','f-level','f-idno','f-date-start','f-date-end']
    .forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  currentFilterType = 'all';
  document.querySelectorAll('.stat-card').forEach(c=>c.classList.remove('active'));
  document.getElementById('stat-all').classList.add('active');
  filteredUsers = users.slice();
  currentPage = 1;
  renderTable();
  toast('篩選條件已清空');
}

function toggleAdv() {
  advOpen = !advOpen;
  document.getElementById('advSection').style.display = advOpen ? 'block' : 'none';
  document.getElementById('advIcon').className = advOpen ? 'mdi mdi-minus-circle-outline' : 'mdi mdi-plus-circle-outline';
  document.getElementById('advLabel').textContent = advOpen ? '收起進階篩選' : '進階篩選';

function batchAction(action) {
  toast(`確認後將對目前篩選的 ${filteredUsers.length} 位用戶執行「${action}」操作`);

function exportCsv() {
  // Update modal counts based on current filteredUsers
  const nLow    = filteredUsers.filter(u=>u.risk==='low').length;
  const nMedium = filteredUsers.filter(u=>u.risk==='medium').length;
  const nHigh   = filteredUsers.filter(u=>u.risk==='high').length;
  document.getElementById('modal-n-low').textContent    = `${nLow} 筆`;
  document.getElementById('modal-n-medium').textContent = `${nMedium} 筆`;
  document.getElementById('modal-n-high').textContent   = `${nHigh} 筆`;

  // Reset checkboxes
  ['chk-low','chk-medium','chk-high','chk-all'].forEach(id=>{
    document.getElementById(id).checked = false;
  });
  ['item-low','item-medium','item-high'].forEach(id=>{
    document.getElementById(id).className='modal-risk-item';
  });
  document.getElementById('modal-selected-count').textContent = '0';

  document.getElementById('exportModal').classList.add('show');
}

function closeExportModal() {
  document.getElementById('exportModal').classList.remove('show');
}

function handleOverlayClick(e) {
  if(e.target === document.getElementById('exportModal')) closeExportModal();
}

function toggleRiskItem(level) {
  const chk = document.getElementById(`chk-${level}`);
  chk.checked = !chk.checked;
  updateItemStyle(level);
  syncAllCheckbox();
}

function updateItemStyle(level) {
  const chk = document.getElementById(`chk-${level}`);
  const item = document.getElementById(`item-${level}`);
  item.className = 'modal-risk-item' + (chk.checked ? ` selected-${level}` : '');
}

function toggleAllRisk(checked) {
  ['low','medium','high'].forEach(l=>{
    document.getElementById(`chk-${l}`).checked = checked;
    updateItemStyle(l);
  });
  updateSelectedCount();
}

function syncAllCheckbox() {
  updateSelectedCount();
  const all = ['chk-low','chk-medium','chk-high'].every(id=>document.getElementById(id).checked);
  const none= ['chk-low','chk-medium','chk-high'].every(id=>!document.getElementById(id).checked);
  const allChk = document.getElementById('chk-all');
  allChk.checked = all;
  allChk.indeterminate = !all && !none;
  ['low','medium','high'].forEach(updateItemStyle);
}

function updateSelectedCount() {
  const nLow    = filteredUsers.filter(u=>u.risk==='low').length;
  const nMedium = filteredUsers.filter(u=>u.risk==='medium').length;
  const nHigh   = filteredUsers.filter(u=>u.risk==='high').length;
  let total = 0;
  if(document.getElementById('chk-low').checked)    total += nLow;
  if(document.getElementById('chk-medium').checked) total += nMedium;
  if(document.getElementById('chk-high').checked)   total += nHigh;
  document.getElementById('modal-selected-count').textContent = total;
}

function confirmExport() {
  const chkLow    = document.getElementById('chk-low').checked;
  const chkMedium = document.getElementById('chk-medium').checked;
  const chkHigh   = document.getElementById('chk-high').checked;

  if(!chkLow && !chkMedium && !chkHigh) {
    toast('請至少選擇一個風險等級');
    return;
  }

  const selectedRisks = [];
  if(chkLow)    selectedRisks.push('low');
  if(chkMedium) selectedRisks.push('medium');
  if(chkHigh)   selectedRisks.push('high');

  const exportRows = filteredUsers.filter(u=>selectedRisks.includes(u.risk));

  const headers = ['用戶類型','用戶ID','用戶名稱','電子信箱','手機','用戶等級','真實姓名','風險等級','最近評分時間','GA狀態','帳號狀態','註冊時間','最後登入時間'];
  const rows = exportRows.map(u=>[
    u.type,u.id,u.uname,u.email,u.phone,u.level,u.rname,RISK_LABEL[u.risk],u.scoredAt,u.ga,u.status,u.reg,u.lastLogin
  ].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));

  const csv = '﻿' + [headers.join(','),...rows].join('\r\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const labels = selectedRisks.map(r=>RISK_LABEL[r]).join('_');
  a.download = `用戶列表整合風險_${labels}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();

  closeExportModal();
  toast(`匯出成功！共 ${exportRows.length} 筆`);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove('show'),2000);
}

// Init
updateStats();
filteredUsers = users.slice();
document.getElementById('stat-all').classList.add('active');
renderTable();
